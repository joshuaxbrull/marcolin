<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marcolin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #1c1914;
      color: #f4f1ea;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      padding: 2rem;
    }
    main { width: min(36rem, 100%); }
    p.kicker {
      color: #f15a22;
      letter-spacing: 0.32em;
      font-size: 0.8rem;
      font-weight: 700;
    }
    h1 { font-size: 2.4rem; margin: 0.4rem 0 1.6rem; letter-spacing: 0.04em; }
    a {
      display: block;
      color: inherit;
      text-decoration: none;
      border: 1px solid #3a342c;
      padding: 1.1rem 1.2rem;
      margin-bottom: 0.8rem;
      background: #161310;
    }
    a:hover { border-color: #f15a22; }
    a strong { display: block; font-size: 1.05rem; }
    a span { color: #b8b2a6; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Marcolin</p>
    <h1>Brand sites</h1>
    <a href="./harleydavidson/">
      <strong>Harley-Davidson Eyewear</strong>
      <span>Store locator · MD, DE, VA, WV</span>
    </a>
    <a href="./worldcup/">
      <strong>World Cup</strong>
      <span>Adidas World Cup site</span>
    </a>
    <a href="./portal/">
      <strong>Manager portal</strong>
      <span>Add or remove locations</span>
    </a>
  </main>
</body>
</html>
